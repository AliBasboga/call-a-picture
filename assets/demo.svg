<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-label="Demo animation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#af002d"/>
      <stop offset="100%" stop-color="#320b86"/>
    </linearGradient>
    <style>
      .title { font: bold 20px/1.2 sans-serif; fill: #ffffff }
      .sub { font: 12px/1 sans-serif; fill: #ffffff }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)">
    <animate attributeName="x" values="0;600" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(20,20)">
    <rect x="0" y="0" rx="8" ry="8" width="160" height="80" fill="#fff" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.4;0.12" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="12" y="28" class="title">Call a Picture</text>
    <text x="12" y="50" class="sub">Pexels demo — örnek görseller</text>
  </g>

  <g transform="translate(220,10)">
    <g id="cards">
      <rect x="0" y="0" rx="6" ry="6" width="120" height="80" fill="#ffffff" opacity="0.18">
        <animate attributeName="x" values="0;10;0" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="140" y="0" rx="6" ry="6" width="120" height="80" fill="#ffffff" opacity="0.14">
        <animate attributeName="x" values="0;-10;0" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="280" y="0" rx="6" ry="6" width="120" height="80" fill="#ffffff" opacity="0.10">
        <animate attributeName="y" values="0;6;0" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(20,76)">
    <text x="0" y="14" class="sub">Canlı demo: klonlayın ve img.html'i açın (Demo butonunu kullanın)</text>
  </g>
</svg>
