<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Call a Picture demo animation">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 20px/1.1 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; fill: white }
      .sub { font: 400 12px/1 Inter, system-ui, sans-serif; fill: rgba(255,255,255,0.92) }
      .muted { fill: rgba(255,255,255,0.75); font: 400 11px/1 Inter, sans-serif }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="url(#g1)" />

  <g transform="translate(22,20)">
    <text x="0" y="20" class="title">Call a Picture</text>
    <text x="0" y="42" class="sub">SVG demo — yalnızca bu dosya değiştirildi</text>
  </g>

  <!-- Camera icon -->
  <g transform="translate(480,18)" filter="url(#shadow)" opacity="0.98">
    <rect x="-6" y="-6" width="96" height="72" rx="8" fill="#ffffff" opacity="0.06" />
    <g transform="translate(8,6)">
      <rect x="0" y="6" width="72" height="42" rx="6" fill="#fff" opacity="0.12" />
      <circle cx="36" cy="27" r="14" fill="#fff" opacity="0.18">
        <animate attributeName="r" values="12;16;12" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <rect x="52" y="4" width="6" height="6" rx="2" fill="#fff" opacity="0.18">
        <animate attributeName="y" values="4;0;4" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Animated thumbnails row -->
  <g transform="translate(24,80)">
    <g id="thumbs">
      <rect x="0" y="0" width="120" height="64" rx="8" fill="#ffffff" opacity="0.10">
        <animate attributeName="y" values="0;-6;0" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="140" y="0" width="120" height="64" rx="8" fill="#ffffff" opacity="0.08">
        <animate attributeName="x" values="140;146;140" dur="2.5s" repeatCount="indefinite" />
      </rect>
      <rect x="280" y="0" width="120" height="64" rx="8" fill="#ffffff" opacity="0.06">
        <animate attributeName="opacity" values="0.06;0.18;0.06" dur="3.2s" repeatCount="indefinite" />
      </rect>
      <rect x="420" y="0" width="120" height="64" rx="8" fill="#ffffff" opacity="0.05">
        <animate attributeName="x" values="420;414;420" dur="2.8s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="0" y="86" class="muted">Canlı demo: sadece assets/demo.svg güncellendi</text>
  </g>
</svg>
